<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>My DTF</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#090B11;color:#EEF0F5;font-family:'Segoe UI',Tahoma,sans-serif}
.c{text-align:center}.d{width:14px;height:14px;border-radius:50%;background:#E6B325;margin:0 auto 18px;animation:p 1.2s infinite;box-shadow:0 0 18px #E6B325}
@keyframes p{50%{transform:scale(1.6);opacity:.4}}p{color:#8E95A8}button{margin-top:14px;padding:10px 22px;border:0;border-radius:12px;background:#E6B325;color:#17120A;font-weight:700;font-size:15px;cursor:pointer}</style></head>
<body><div class="c"><div class="d"></div><h2>لا يوجد اتصال بالإنترنت</h2><p>يعود البرنامج وحده عند رجوع الاتصال…</p><button onclick="go()">إعادة المحاولة الآن</button></div>
<script>
const U = new URLSearchParams(location.search).get('u') || 'https://mydtf-admin.pages.dev/';
function go(){ fetch(U,{mode:'no-cors',cache:'no-store'}).then(()=>location.href=U).catch(()=>{}); }
setInterval(go, 4000);
</script></body></html>
