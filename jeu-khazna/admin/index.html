<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#020504">
<title>الخزنة — مركز القيادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#020504;--bg2:#06100c;--glass:rgba(10,24,18,.62);--glass2:rgba(14,34,26,.75);--line:rgba(0,255,156,.12);--line2:rgba(0,255,156,.28);
  --neon:#00ff9c;--neon2:#00c97a;--cyan:#00e5ff;--amber:#ffb020;--red:#ff3b5c;--violet:#a78bfa;
  --text:#e3fff1;--muted:#7fa393;--faint:#3d5a4d;--r:14px;--sb:250px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;font-size:15px;overflow-x:hidden}
.mono{font-family:'Share Tech Mono',monospace;letter-spacing:.5px}
::selection{background:var(--neon);color:#001a0e}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--faint);border-radius:8px}

/* خلفية حيّة */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(700px 500px at 85% -10%,rgba(0,255,156,.10),transparent 60%),
  radial-gradient(600px 500px at 0% 110%,rgba(0,229,255,.08),transparent 60%),
  radial-gradient(500px 400px at 50% 50%,rgba(167,139,250,.04),transparent 70%)}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
#root{position:relative;z-index:2}

/* أزرار وحقول */
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);color:var(--neon);background:rgba(0,255,156,.04);transition:.18s}
.btn:hover{background:rgba(0,255,156,.10);box-shadow:0 0 0 1px var(--neon2) inset,0 0 22px rgba(0,255,156,.15)}
.btn.solid{background:linear-gradient(135deg,var(--neon),#00d9a0);color:#002414;border-color:transparent;box-shadow:0 6px 24px rgba(0,255,156,.28)}
.btn.solid:hover{filter:brightness(1.08);box-shadow:0 8px 30px rgba(0,255,156,.42)}
.btn.red{color:var(--red);border-color:rgba(255,59,92,.35);background:rgba(255,59,92,.05)}
.btn.red:hover{background:rgba(255,59,92,.12);box-shadow:0 0 22px rgba(255,59,92,.18)}
.btn.amber{color:var(--amber);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.05)}
.btn.ghost{border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--text);box-shadow:none;background:rgba(255,255,255,.04)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:17px;height:17px}
input,select,textarea{font:inherit;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,255,156,.12)}
.field{display:flex;flex-direction:column;gap:7px}.field>span{color:var(--muted);font-size:13px;font-weight:700}
.field .in{position:relative}.field .in input{width:100%}.field .in i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-style:normal;font-size:12.5px}

/* زجاج */
.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card.pad{padding:20px}
.card::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,255,156,.35),transparent 35%,transparent 65%,rgba(0,229,255,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ch h3{margin:0;font-size:16.5px;font-weight:800}
.ch .sub{color:var(--muted);font-size:12.5px}
.ch .sp{flex:1}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(0,255,156,.08);color:var(--neon);border:1px solid var(--line)}
.ic svg{width:18px;height:18px}

/* ───── الدخول ───── */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:420px;padding:34px 30px}
.radar{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;position:relative;border:1px solid var(--line2);
  background:radial-gradient(circle,rgba(0,255,156,.10) 0 1px,transparent 1px) 0 0/14px 14px,radial-gradient(circle,rgba(0,255,156,.08),transparent 70%);box-shadow:0 0 50px rgba(0,255,156,.15),inset 0 0 30px rgba(0,255,156,.08)}
.radar::before,.radar::after{content:'';position:absolute;inset:18px;border-radius:50%;border:1px solid var(--line)}
.radar::after{inset:38px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,255,156,.45),transparent 25%);animation:spin 2.6s linear infinite}
.radar .lock{position:absolute;inset:0;display:grid;place-items:center;color:var(--neon);filter:drop-shadow(0 0 10px var(--neon))}
.radar .lock svg{width:40px;height:40px}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:44px;font-weight:900;text-align:center;margin:0;letter-spacing:1px;color:var(--neon);text-shadow:0 0 18px rgba(0,255,156,.55),0 0 2px #fff;position:relative}
.title.glitch::before,.title.glitch::after{content:attr(data-t);position:absolute;inset:0;opacity:.6}
.title.glitch::before{color:var(--cyan);animation:g1 3.2s infinite steps(1);clip-path:inset(0 0 60% 0)}
.title.glitch::after{color:var(--red);animation:g2 3.2s infinite steps(1);clip-path:inset(55% 0 0 0)}
@keyframes g1{0%,92%,100%{transform:none}93%{transform:translate(-3px,1px)}96%{transform:translate(2px,-1px)}}
@keyframes g2{0%,90%,100%{transform:none}91%{transform:translate(3px,0)}95%{transform:translate(-2px,1px)}}
.tagline{text-align:center;color:var(--muted);margin:6px 0 26px;font-size:13px}
.lbox .field{margin-bottom:14px}
.err{color:var(--red);font-weight:700;min-height:22px;font-size:14px}
.typed::after{content:'▌';animation:blink 1s steps(1) infinite;color:var(--neon)}@keyframes blink{50%{opacity:0}}

/* ───── الهيكل ───── */
.shell{display:flex;min-height:100vh}
aside{width:var(--sb);flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(6,16,12,.92),rgba(3,8,6,.92));border-left:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--neon),var(--cyan));color:#00140b;box-shadow:0 0 24px rgba(0,255,156,.4)}
.brand .logo svg{width:22px;height:22px}
.brand b{font-size:21px;font-weight:900;display:block;line-height:1}.brand small{color:var(--muted);font-size:11px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:700;cursor:pointer;position:relative;transition:.15s;text-decoration:none}
.nav a svg{width:19px;height:19px}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav a.on{color:var(--neon);background:linear-gradient(90deg,transparent,rgba(0,255,156,.10));box-shadow:inset -3px 0 0 var(--neon)}
.nav a .cnt{margin-right:auto;background:var(--red);color:#fff;font-size:11.5px;border-radius:20px;padding:1px 8px;box-shadow:0 0 14px rgba(255,59,92,.6);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 2px rgba(255,59,92,.4)}}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--neon);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 0 0 rgba(0,255,156,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(0,255,156,0)}100%{box-shadow:0 0 0 0 rgba(0,255,156,0)}}
.main{flex:1;min-width:0;padding:0 26px 40px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:16px 0;margin-bottom:8px;background:linear-gradient(180deg,var(--bg) 60%,transparent)}
.top h2{margin:0;font-size:24px;font-weight:900}.top .crumb{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.clock{padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--cyan);font-size:14px}
.bell{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.bell svg{width:20px;height:20px}.bell .cnt{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:1px 6px}
.me{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-radius:12px;border:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#00140b;flex:none;font-size:14px}
.dd{position:absolute;top:52px;left:0;width:330px;max-height:420px;overflow:auto;padding:10px;z-index:40;display:none}
.dd.open{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.dd .it{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}.dd .it:hover{background:rgba(255,255,255,.04)}
.view{animation:fadeup .35s ease-out}@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}

/* ───── الإحصائيات ───── */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));margin-bottom:16px}
.kpi{padding:18px;overflow:hidden}
.kpi .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi .lab{color:var(--muted);font-weight:700;font-size:13px}
.kpi .val{font-size:32px;font-weight:900;line-height:1;font-family:'Share Tech Mono',monospace}
.kpi .foot{margin-top:10px;font-size:12.5px;color:var(--muted)}
.kpi .glow{position:absolute;width:140px;height:140px;border-radius:50%;left:-40px;bottom:-60px;filter:blur(40px);opacity:.25;pointer-events:none}
.kpi canvas{position:absolute;left:0;right:0;bottom:0;height:46px!important;width:100%!important;opacity:.55;pointer-events:none}
.g2{display:grid;gap:16px;grid-template-columns:2fr 1fr;margin-bottom:16px}
.g2b{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-bottom:16px}
.chart{position:relative;height:260px}
.feed .ev{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.feed .ev:last-child{border:0}
.feed .ev .t{color:var(--muted);font-size:12px;margin-right:auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:30px;border:1px solid var(--line);white-space:nowrap}
.pill.g{color:var(--neon);background:rgba(0,255,156,.07);border-color:rgba(0,255,156,.25)}
.pill.r{color:var(--red);background:rgba(255,59,92,.07);border-color:rgba(255,59,92,.3)}
.pill.a{color:var(--amber);background:rgba(255,176,32,.07);border-color:rgba(255,176,32,.3)}
.pill.c{color:var(--cyan);background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.3)}
.pill.v{color:var(--violet);background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.3)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty svg{width:42px;height:42px;opacity:.35;display:block;margin:0 auto 10px}

/* ───── الجداول ───── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}.search input{width:100%;padding-right:40px}.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:30px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer}
.chip.on{color:#002414;background:var(--neon);border-color:var(--neon)}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:right;color:var(--muted);font-size:12.5px;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid rgba(0,255,156,.06);vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:.12s}.tbl tr.click:hover td{background:rgba(0,255,156,.035)}
.who{display:flex;align-items:center;gap:12px}.who b{display:block}.who small{color:var(--muted);font-size:12px}
.bal{min-width:120px}.bal .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
.bal .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--neon2),var(--neon))}
.bal .bar i.low{background:linear-gradient(90deg,#b3002a,var(--red))}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--faint)}.sdot.on{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.scroll{overflow-x:auto}

/* ───── لوحة جانبية ونوافذ ───── */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(460px,100%);z-index:51;padding:22px;overflow:auto;border-radius:0;animation:slide .28s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,rgba(8,20,15,.97),rgba(4,10,8,.97))}
@keyframes slide{from{transform:translateX(-100%)}}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.modal .card{width:100%;max-width:440px;padding:24px;animation:pop .2s ease-out;background:rgba(8,20,15,.96)}
.modal h3{margin:0 0 6px;font-size:19px}.modal p{color:var(--muted);margin:0 0 16px;line-height:1.6}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.quick button{padding:10px 0;border-radius:10px;border:1px solid var(--line);color:var(--neon);font-weight:800;font-family:'Share Tech Mono',monospace}
.quick button.neg{color:var(--red);border-color:rgba(255,59,92,.25)}
.quick button:hover{background:rgba(0,255,156,.08)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat3 div{padding:12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);text-align:center}
.stat3 b{display:block;font-size:22px;font-family:'Share Tech Mono',monospace}.stat3 small{color:var(--muted);font-size:12px}
.ledger .l{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ledger .l .d{margin-right:auto;font-family:'Share Tech Mono',monospace;font-weight:700}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 0 60px rgba(0,255,156,.2)}

/* ───── الدفع ───── */
.pays{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pay{padding:16px;display:flex;flex-direction:column;gap:12px}
.pay .rc{height:150px;border-radius:12px;background:rgba(0,0,0,.4) center/cover no-repeat;border:1px solid var(--line);cursor:zoom-in;display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.pay .amt{font-size:28px;font-weight:900;color:var(--amber);font-family:'Share Tech Mono',monospace}
.pay .ref{background:rgba(0,0,0,.35);border:1px dashed var(--line2);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.pay.pending{box-shadow:0 0 0 1px rgba(255,176,32,.25),0 10px 40px rgba(0,0,0,.35)}

/* ───── الإعدادات ───── */
.sgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.region{margin-bottom:18px}
.region h4{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:14.5px}
.region h4 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.stg label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.stg label small{color:var(--muted);font-family:'Share Tech Mono',monospace}
.stg label.boss{border-color:rgba(255,59,92,.4);background:rgba(255,59,92,.05)}
.stg input{width:70px;text-align:center;padding:7px}
.pkg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.pk{padding:16px;text-align:center}
.pk .m{font-size:34px;font-weight:900;color:var(--neon);font-family:'Share Tech Mono',monospace}
.pk input{width:100%;text-align:center;margin-top:8px}
.sw{position:relative;width:46px;height:26px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid var(--line);cursor:pointer;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:rgba(0,255,156,.2);border-color:var(--neon)}.sw.on::after{right:23px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.savebar{position:sticky;bottom:14px;z-index:5;margin-top:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}

/* ───── الغرف ───── */
.rooms{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.room{padding:18px}.room .code{font-size:30px;font-weight:900;color:var(--cyan);font-family:'Share Tech Mono',monospace;letter-spacing:6px}
.vs{display:flex;align-items:center;gap:10px;margin-top:14px}.vs span{color:var(--muted);font-weight:800}

#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:90;padding:12px 18px;border-radius:12px;font-weight:700;transition:.25s;pointer-events:none;display:flex;gap:10px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* موبايل */
.tabbar{display:none}
@media (max-width:900px){
  aside{display:none}
  .main{padding:0 14px 96px}
  .g2,.g2b{grid-template-columns:1fr}
  .top h2{font-size:20px}.clock,.me .nm,.hide-m{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(3,8,6,.95);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:700;position:relative;padding:4px 0;cursor:pointer}
  .tabbar a svg{width:21px;height:21px}.tabbar a.on{color:var(--neon)}
  .tabbar a .cnt{position:absolute;top:-2px;left:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:0 5px}
  .tbl th,.tbl td{padding:10px 8px}
  .dd{width:min(330px,calc(100vw - 28px))}
}
</style>
</head>

<div class="bg-glow"></div><canvas id="fx"></canvas><div class="scan"></div>

function beep() {
  try {
    const a = new AudioContext();
    [880, 1320].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = f;
      o.connect(g); g.connect(a.destination); const t0 = a.currentTime + i * .14;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.18, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.start(t0); o.stop(t0 + .32);
    });
  } catch {}
}
function countUp(el, to, fmt = nf) {
  const t0 = performance.now(), d = 900;
  const step = (t) => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ───── خلفية: شبكة نقاط متحرّكة ─────
(function fx() {
  const c = $('#fx'), x = c.getContext('2d'); let W, H, pts;
  const init = () => { W = c.width = innerWidth; H = c.height = innerHeight; pts = Array.from({ length: Math.min(70, W / 22) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25 })); };
  const loop = () => {
    x.clearRect(0, 0, W, H);
    for (const p of pts) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { x.strokeStyle = `rgba(0,255,156,${.07 * (1 - d / 130)})`; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
    }
    x.fillStyle = 'rgba(0,255,156,.35)'; for (const p of pts) x.fillRect(p.x - 1, p.y - 1, 2, 2);
    requestAnimationFrame(loop);
  };
  addEventListener('resize', init); init(); loop();
})();

  if (!admin) { await sb.auth.signOut(); return renderLogin('هذا الحساب ليس مديراً'); }
  const { data: me } = await sb.from('profiles').select('nickname').eq('id', session.user.id).single();
  S.me = { nickname: me?.nickname || 'المدير', email: session.user.email };
  renderShell();
  await pollPending(true);

}

async function pollPending(first) {
  const { data } = await sb.from('payment_requests')
    .select('id, minutes, amount_dzd, created_at, profiles!payment_requests_user_id_fkey(nickname)')
    .eq('status', 'pending').order('created_at', { ascending: false }).limit(20);
  const n = data?.length || 0;
  if (!first && n > S.pending) {
    beep(); toast(`طلب دفع جديد — ${n} في الانتظار`, 'warn');
    if ('Notification' in window && Notification.permission === 'granted') new Notification('الخزنة: طلب دفع جديد', { body: `${n} طلب في الانتظار` });
    if (S.tab === 'payments' || S.tab === 'home') show(S.tab);

  document.title = n ? `(${n}) الخزنة — مركز القيادة` : 'الخزنة — مركز القيادة';

Chart.defaults.color = '#7fa393'; Chart.defaults.font.family = 'Tajawal'; Chart.defaults.borderColor = 'rgba(0,255,156,.07)';

function drawPlayers() {
  const q = S.pf.q.trim().toLowerCase(), f = S.pf.f, week = Date.now() - 7 * 864e5;
  const maxBal = Math.max(6000, ...S.players.map((p) => p.balance_seconds));

    (f === 'all' || (f === 'online' && p.online) || (f === 'banned' && p.banned) || (f === 'low' && p.balance_seconds < 600) || (f === 'new' && new Date(p.created_at) > week)));
  const by = { new: (a, b) => new Date(b.created_at) - new Date(a.created_at), seen: (a, b) => new Date(b.last_seen) - new Date(a.last_seen), bal: (a, b) => b.balance_seconds - a.balance_seconds, stage: (a, b) => b.best_stage - a.best_stage };
  list = list.sort(by[S.pf.sort]);
  $('#tb').innerHTML = `<tr><th>العميل</th><th>الحالة</th><th>الرصيد</th><th>المرحلة</th><th class="hide-m">التسجيل</th><th class="hide-m">آخر دخول</th></tr>` +

      <td><div class="who">${avatar(p.nickname, 38)}<div><b>${esc(p.nickname)} ${p.role === 'admin' ? '<span class="pill a">مدير</span>' : ''}</b><small dir="ltr">${esc(p.email)}</small></div></div></td>
      <td>${p.banned ? '<span class="pill r">محظور</span>' : p.online ? '<span class="pill g"><span class="sdot on"></span> متصل</span>' : '<span class="pill"><span class="sdot"></span> غير متصل</span>'}</td>
      <td class="bal"><b class="mono">${mins(p.balance_seconds)}</b> <small style="color:var(--muted)">دقيقة</small><div class="bar"><i class="${p.balance_seconds < 600 ? 'low' : ''}" style="width:${Math.min(100, (p.balance_seconds / maxBal) * 100)}%"></i></div></td>

}

  };

        <div class="ref"><small style="color:var(--muted)">رقم العملية</small><b class="mono" dir="ltr">${esc(r.transaction_ref)}</b></div>
        ${r.status === 'pending' ? `<div style="display:flex;gap:8px"><button class="btn solid" style="flex:1;justify-content:center" data-ok="${r.id}">${ico('check')} قبول</button>
          <button class="btn red" style="flex:1;justify-content:center" data-no="${r.id}">${ico('x')} رفض</button></div>`

async function vSettings(v) {
  const [{ data: st, error: e1 }, { data: sc, error: e2 }, { data: pk, error: e3 }] = await Promise.all([
    sb.from('settings').select('*'), sb.from('stage_config').select('*').order('stage'), sb.from('packages').select('*').order('sort')]);
  if (e1 || e2 || e3) throw e1 || e2 || e3;
  const sv = Object.fromEntries(st.map((r) => [r.key, r.value]));
  const num = (k, lab, unit, icon, col = 'var(--neon)') => `<div class="card pad"><div class="ch" style="margin-bottom:12px"><span class="ic" style="color:${col}">${ico(icon)}</span><h3 style="font-size:14.5px">${lab}</h3></div>
    <div class="field"><div class="in"><input type="number" min="0" step="${unit === 'min' ? '0.5' : '1'}" data-k="${k}" data-u="${unit}" value="${unit === 'min' ? (sv[k] ?? 0) / 60 : sv[k] ?? 0}"><i>${unit === 'min' ? 'دقيقة' : 'ثانية'}</i></div></div></div>`;
  v.innerHTML = `<div>
    <div class="ch"><span class="ic">${ico('gear')}</span><div><h3>قواعد الوقت</h3><div class="sub">تُطبَّق فوراً على كل اللاعبين</div></div></div>
    <div class="sgrid" style="margin-bottom:22px">
      ${num('signup_bonus_seconds', 'هدية التسجيل', 'min', 'gift')}
      ${num('daily_free_seconds', 'الوقت المجاني اليومي', 'min', 'clock', 'var(--cyan)')}
      ${num('error_penalty_seconds', 'عقوبة كل خطأ (من اللاعبَين)', 'sec', 'alert', 'var(--red)')}
      ${num('max_penalty_per_stage_seconds', 'أقصى عقوبة في المرحلة', 'sec', 'ban', 'var(--red)')}
      ${num('hint_cost_seconds', 'ثمن التلميح', 'min', 'zap', 'var(--amber)')}
    </div>
    <div class="ch"><span class="ic" style="color:var(--amber)">${ico('bank')}</span><div><h3>بريدي موب</h3><div class="sub">يظهر للاعب عند الشراء</div></div></div>
    <div class="card pad" style="margin-bottom:22px"><div class="sgrid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">
      <div class="field"><span>RIP</span><input data-k="baridimob_rip" data-u="text" dir="ltr" class="mono" placeholder="00799999 xxxxxxxxxx xx" value="${esc(sv.baridimob_rip ?? '')}"></div>
      <div class="field"><span>اسم صاحب الحساب</span><input data-k="baridimob_name" data-u="text" value="${esc(sv.baridimob_name ?? '')}"></div></div></div>

    <div class="ch"><span class="ic" style="color:var(--amber)">${ico('coin')}</span><div><h3>الباقات</h3><div class="sub">ما يراه اللاعب في المتجر</div></div><span class="sp"></span><button class="btn sm" id="addP">${ico('plus')} باقة</button></div>
    <div class="pkg" style="margin-bottom:22px">${pk.map((p) => `<div class="card pk" data-id="${p.id}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill ${p.active ? 'g' : ''}">${p.active ? 'مفعّلة' : 'مخفيّة'}</span><span class="sw ${p.active ? 'on' : ''}"></span></div>
      <div class="m"><span class="pm-v">${p.minutes}</span><small style="font-size:14px;color:var(--muted)"> دقيقة</small></div>
      <div class="field" style="text-align:right"><span>الدقائق</span><input type="number" min="1" class="pm" value="${p.minutes}"></div>
      <div class="field" style="text-align:right;margin-top:8px"><span>السعر (دج)</span><input type="number" min="1" class="pp" value="${p.price_dzd}"></div>
      <div style="color:var(--muted);font-size:12.5px;margin-top:8px" class="ppm">${(p.price_dzd / p.minutes).toFixed(2)} دج / دقيقة</div></div>`).join('')}</div>

    <div class="ch"><span class="ic" style="color:var(--cyan)">${ico('flag')}</span><div><h3>وقت كل مرحلة</h3><div class="sub">بالدقائق — المرحلة الأخيرة في كل خريطة هي «الزعيم»</div></div></div>
    <div class="card pad">
      <div class="toolbar"><span style="color:var(--muted)">تعديل جماعي:</span><input id="b1" type="number" value="1" style="width:76px"><span style="color:var(--muted)">←</span>
        <input id="b2" type="number" value="60" style="width:76px"><input id="bv" type="number" step="0.5" placeholder="دقائق" style="width:96px"><button class="btn sm" id="bulk">تطبيق</button></div>
      ${REGIONS.map(([n, col, a, b]) => `<div class="region"><h4><i style="background:${col};box-shadow:0 0 10px ${col}"></i>${n} <small style="color:var(--muted)">(${a}–${b})</small></h4>
        <div class="stg">${sc.filter((s) => s.stage >= a && s.stage <= b).map((s) => `<label class="${s.stage === b ? 'boss' : ''}"><small>${s.stage === b ? '★ ' : ''}${s.stage}</small>
          <input type="number" step="0.5" min="1" max="120" data-s="${s.stage}" value="${s.time_limit_seconds / 60}"></label>`).join('')}</div></div>`).join('')}
    </div>
    <div class="card savebar"><span style="color:var(--muted);flex:1" id="dirty">لا تغييرات</span><button class="btn solid" id="saveAll">${ico('save')} حفظ كل التغييرات</button></div>
  </div>`;
  let dirty = false;
  const mark = () => { dirty = true; $('#dirty').innerHTML = '<span style="color:var(--amber)">● توجد تغييرات غير محفوظة</span>'; };
  $$('input', v).forEach((i) => i.addEventListener('input', mark));
  $$('.pk', v).forEach((c) => {
    const up = () => { const m = +$('.pm', c).value, pr = +$('.pp', c).value; $('.pm-v', c).textContent = m || 0; $('.ppm', c).textContent = m > 0 ? `${(pr / m).toFixed(2)} دج / دقيقة` : '—'; };
    $('.pm', c).oninput = () => { up(); mark(); }; $('.pp', c).oninput = () => { up(); mark(); };
    $('.sw', c).onclick = (e) => { e.currentTarget.classList.toggle('on'); const on = e.currentTarget.classList.contains('on'); const pl = $('.pill', c); pl.className = `pill ${on ? 'g' : ''}`; pl.textContent = on ? 'مفعّلة' : 'مخفيّة'; mark(); };
  });
  $('#bulk').onclick = () => { const a = +$('#b1').value, b = +$('#b2').value, val = parseFloat($('#bv').value); if (!(val > 0)) return toast('اكتب عدد الدقائق', 'err');
    $$('input[data-s]').forEach((i) => { const s = +i.dataset.s; if (s >= a && s <= b) i.value = val; }); mark(); };
  $('#addP').onclick = async () => { const { error } = await sb.from('packages').insert({ minutes: 60, price_dzd: 100, active: false, sort: pk.length + 1 }); error ? toast(errText(error), 'err') : show('settings'); };
  $('#saveAll').onclick = async () => {
    const b = $('#saveAll'); b.disabled = true;
    try {
      const now = new Date().toISOString();
      const rows = $$('input[data-k]').map((i) => { const u = i.dataset.u, raw = i.value.trim();
        return { key: i.dataset.k, value: u === 'text' ? raw : u === 'min' ? Math.round(parseFloat(raw || 0) * 60) : parseInt(raw || 0, 10), updated_at: now }; });
      const stages = $$('input[data-s]').map((i) => ({ stage: +i.dataset.s, time_limit_seconds: Math.round(parseFloat(i.value) * 60), updated_at: now }));
      if (stages.some((r) => !(r.time_limit_seconds >= 60 && r.time_limit_seconds <= 7200))) throw new Error('وقت المرحلة بين 1 و 120 دقيقة');
      const pkgs = $$('.pk').map((c) => ({ id: +c.dataset.id, minutes: +$('.pm', c).value, price_dzd: +$('.pp', c).value, active: $('.sw', c).classList.contains('on') }));
      if (pkgs.some((p) => !(p.minutes > 0 && p.price_dzd > 0))) throw new Error('الدقائق والسعر يجب أن تكون أكبر من 0');
      let r = await sb.from('settings').upsert(rows); if (r.error) throw r.error;
      r = await sb.from('stage_config').upsert(stages); if (r.error) throw r.error;
      for (const p of pkgs) { r = await sb.from('packages').update({ minutes: p.minutes, price_dzd: p.price_dzd, active: p.active }).eq('id', p.id); if (r.error) throw r.error; }
      dirty = false; $('#dirty').innerHTML = '<span style="color:var(--neon)">✓ كل شيء محفوظ</span>'; toast('حُفظت الإعدادات');
    } catch (e) { toast(errText(e), 'err'); }
    b.disabled = false;
  };
  window.onbeforeunload = () => (dirty ? true : undefined);
}

// ───── الغرف الحيّة ─────
async function vRooms(v) {
  const { data, error } = await sb.rpc('admin_rooms');
  if (error) throw error;
  v.innerHTML = `<div>
    <div class="ch"><span class="live"><span class="dot"></span> ${data.length} غرفة مفتوحة</span><span class="sp"></span><button class="btn sm" id="rf">${ico('refresh')} تحديث</button></div>
    ${data.length ? `<div class="rooms">${data.map((r) => `<div class="card room">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="code">${esc(r.code)}</span>
        <span class="pill ${r.status === 'playing' ? 'g' : 'a'}">${r.status === 'playing' ? '● يلعبون' : 'في الانتظار'}</span></div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">${r.stage ? `المرحلة <b class="mono" style="color:var(--cyan)">${r.stage}</b> · ` : ''}${ago(r.updated_at)}</div>
      <div class="vs">${avatar(r.host)}<b>${esc(r.host)}</b><span>×</span>${r.guest ? `${avatar(r.guest)}<b>${esc(r.guest)}</b>` : '<span style="font-weight:500">بانتظار شريك…</span>'}</div>
    </div>`).join('')}</div>` : `<div class="card pad empty">${ico('door')}لا توجد غرف مفتوحة الآن<br><small>تُسجَّل الغرف في الخادم مع مرحلة العداد</small></div>`}</div>`;
  $('#rf').onclick = () => show('rooms');
}

boot();
</script>
</body>
</html>
