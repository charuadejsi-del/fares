name: khazna
description: "الخزنة — مهمّة تجسّس جماعية: العميل يرى الأقفال والمحلّل معه الدليل."
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  # عميل Supabase بلغة Dart فقط للّعب أونلاين عبر Realtime
  supabase: ^2.6.0
  # الكلام الصوتي أثناء اللعب أونلاين
  agora_rtc_engine: ^6.5.0
  permission_handler: ^11.3.1
  # صورة وصل الدفع (معرض الصور / الكاميرا)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/sfx/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
    - family: Mono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
