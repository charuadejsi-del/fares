# نموذج «الخزنة 3D» (Godot 4): يُبنى عند تحديث مجلّد godot_3d في فرع jeu-khazna.
name: Khazna 3D (Godot)

on:
  push:
    branches: [jeu-khazna]
    paths:
      - 'jeu-khazna/godot_3d/**'
      - '.github/workflows/khazna-godot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agora:
    # مكتبة صوت Agora لـ Godot (AAR) — تُبنى بـ Gradle ثم تُعطى لخطوة بناء اللعبة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: بناء مكتبة الصوت
        run: |
          cd jeu-khazna/godot_3d/android_plugin
          gradle :agora:assembleRelease --no-daemon
          ls -la agora/build/outputs/aar/
      - uses: actions/upload-artifact@v4
        with:
          name: godot-agora
          path: jeu-khazna/godot_3d/android_plugin/agora/build/outputs/aar/*.aar

  agorawin:
    # صوت Agora لنسخة ويندوز: إضافة GDExtension (C++) مبنية مقابل مكتبة Agora لويندوز، ثم اختبار حقيقي للدخول إلى القناة
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: jeu-khazna/godot_3d/windows_plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: مكتبة Agora لويندوز
        run: |
          for u in https://download.agora.io/sdk/release/Agora_Native_SDK_for_Windows_v4.5.2_VOICE.zip \
                   https://download.agora.io/sdk/release/Agora_Native_SDK_for_Windows_v4.3.2_VOICE.zip \
                   https://download.agora.io/sdk/release/Agora_Native_SDK_for_Windows_v4.7.0_FULL.zip; do
            echo "تحميل $u"; curl -fsSL -o sdk.zip "$u" && break
          done
          test -f sdk.zip
          mkdir -p sdk agora/include agora/lib bin && unzip -q sdk.zip -d sdk
          H=$(dirname "$(find sdk -name IAgoraRtcEngine.h | grep -v x86/ | head -1)")
          D=$(dirname "$(find sdk -name agora_rtc_sdk.dll -path '*x86_64*' | head -1)")
          echo "headers=$H dlls=$D"; ls "$D"
          cp -r "$H"/* agora/include/
          cp "$D"/agora_rtc_sdk.dll.lib agora/lib/agora_rtc_sdk.lib 2>/dev/null || cp "$D"/agora_rtc_sdk.lib agora/lib/agora_rtc_sdk.lib
          cp "$D"/agora_rtc_sdk.dll bin/
          for f in "$D"/*aosl*.dll; do [ -f "$f" ] && cp "$f" bin/; done
          echo "$D" > sdkdir.txt
          ls -la bin
      - name: بناء الإضافة
        run: |
          pip install scons
          git clone -q --depth 1 -b godot-4.3-stable https://github.com/godotengine/godot-cpp
          scons platform=windows target=template_release arch=x86_64 -j4
          ls -la bin
          test -f bin/godot_agora_win.dll
          python ci/collect.py "$(cat sdkdir.txt)"
      - name: اختبار حقيقي على ويندوز (تحميل المكتبة والدخول إلى قناة الصوت)
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip
          unzip -q godot.zip -d gd
          G=$(ls gd/*console*.exe | head -1)
          mkdir -p test/addons/godot_agora_win/bin
          printf '[application]\nconfig/name="t"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > test/project.godot
          cp bin/*.dll test/addons/godot_agora_win/bin/
          cp ../addons/godot_agora_win/godot_agora_win.gdextension test/addons/godot_agora_win/
          python ci/deps.py test/addons/godot_agora_win
          cp ci/test_voice.gd test/
          KEY=$(grep -oE 'eyJ[A-Za-z0-9._-]+' ../net.gd | head -1)
          export KHAZNA_CH=khazna-4321-$(printf "khazna3d-4321" | md5sum | cut -c1-8)
          export KHAZNA_TOKEN=$(curl -s -X POST https://ubdamgzqqwgcxjvvegwk.supabase.co/functions/v1/agora-token -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -d "{\"channel\":\"$KHAZNA_CH\",\"appId\":\"9fd63619ac984e71b3c3eba6215b5a32\"}" | python -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          echo "token length: ${#KHAZNA_TOKEN}"
          "$G" --headless --path test --editor --quit > imp.log 2>&1 || true
          "$G" --headless --path test -s test_voice.gd > run.log 2>&1 || true
          cat run.log | tail -20
          grep -q "WINVOICE: singleton ok" run.log || { echo "مكتبة الصوت لم تُحمَّل في ويندوز"; exit 1; }
          grep -q "WINVOICE: join ok" run.log && echo "WINVOICE: دخول القناة نجح ✅" || echo "::warning::لم يُؤكَّد دخول القناة في بيئة الاختبار"
      - uses: actions/upload-artifact@v4
        with:
          name: godot-agora-win
          path: jeu-khazna/godot_3d/windows_plugin/bin/*.dll

  build:
    needs: [agora, agorawin]
    if: ${{ !cancelled() && needs.agora.result == 'success' }}
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    defaults:
      run:
        working-directory: jeu-khazna/godot_3d
    steps:
      - uses: actions/checkout@v4

      - name: الإعداد (قوالب التصدير ومفتاح التوقيع)
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          [ -d ~/.config/godot ] || cp -r /root/.config/godot ~/.config/godot || true
          [ -d ~/.local/share/godot/export_templates/4.3.stable ] || cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          ls ~/.local/share/godot/export_templates/
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - uses: actions/download-artifact@v4
        with:
          name: godot-agora
          path: jeu-khazna/godot_3d/addons/godot_agora/bin

      - name: ذاكرة Gradle (تقلّل التحميل من Maven)
        uses: actions/cache@v4
        with:
          path: /github/home/.gradle/caches
          key: godot-gradle-${{ hashFiles('jeu-khazna/godot_3d/addons/godot_agora/*.gd') }}
          restore-keys: godot-gradle-

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: godot-agora-win
          path: jeu-khazna/godot_3d/addons/godot_agora_win/bin

      - name: قالب بناء أندرويد (لإضافة الصوت)
        run: |
          mv addons/godot_agora/bin/*.aar addons/godot_agora/bin/GodotAgora.aar
          ls -la addons/godot_agora/bin
          (command -v unzip >/dev/null && command -v zip >/dev/null && command -v python3 >/dev/null) || (apt-get update -qq && apt-get install -y -qq unzip zip python3 >/dev/null)
          python3 windows_plugin/ci/deps.py addons/godot_agora_win 2>/dev/null || true; ls addons/godot_agora_win/bin
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          echo -n "4.3.stable" > android/.build_version
          touch android/build/.gdignore
          # رابط khazna3d:// (من تطبيق الخزنة الأصلي) يُضاف إلى نشاط Godot في قالب البناء
          python3 - <<'PY'
          import glob, re
          f = '<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="khazna3d" /></intent-filter>'
          for m in glob.glob("android/build/**/AndroidManifest.xml", recursive=True):
              s = open(m, encoding="utf-8").read()
              if "GodotApp" in s and "khazna3d" not in s:
                  i = s.find("</activity>", s.find("GodotApp"))
                  s = s[:i] + f + s[i:]
                  open(m, "w", encoding="utf-8").write(s)
                  print("DEEPLINK added to", m)
          PY
          SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          echo "SDK=$SDK"; ls $SDK || true
          (yes | $SDK/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1) || (yes | sdkmanager --licenses >/dev/null 2>&1) || true

      - name: الأصول (خطّ عربي ونموذج الحارس)
        run: |
          (command -v curl >/dev/null && command -v python3 >/dev/null) || (apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null)
          mkdir -p fonts models
          curl -fsSL -o fonts/Tajawal-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf
          curl -fsSL -o models/CesiumMan.glb https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb
          python3 tools/fetch_assets.py
          ls -la fonts models sounds ph/tex | head -60
          ls ph/models

      - name: استيراد الملفّات
        run: |
          godot --headless --path . --import 2>&1 | tail -20 || true
          [ -d .godot/imported ] || godot --headless --path . --editor --quit 2>&1 | tail -20 || true
          ls .godot/imported | head

      - name: اختبار تشغيل (أخطاء السكربت توقف البناء)
        run: |
          KHAZNA_SMOKE=1 timeout 150 godot --headless --path . > run.log 2>&1 || true
          grep -v "Parameter \"m\" is null\|mesh_storage.h" run.log | tail -80
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid (call|get|set)" run.log; then echo "خطأ في السكربت"; exit 1; fi
          for k in "move ok" "detect ok" "disguise ok" "door ok" "cam ok" "safe ok" "win ok" "all ok"; do
            grep -q "SMOKE $k" run.log || { echo "الاختبار فشل: $k"; exit 1; }
          done
          grep -q "SMOKE voice channel ok" run.log || { echo "اسم قناة الصوت لا يطابق السيرفر"; exit 1; }
          CH=$(grep -o "SMOKE voice channel ok .*" run.log | awk '{print $5}')
          KEY=$(grep -oE 'eyJ[A-Za-z0-9._-]+' net.gd | head -1)
          RESP=$(curl -s -X POST "https://ubdamgzqqwgcxjvvegwk.supabase.co/functions/v1/agora-token" -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -d "{\"channel\":\"$CH\",\"appId\":\"9fd63619ac984e71b3c3eba6215b5a32\"}")
          echo "$RESP" | grep -q '"mode":"secured"' && echo "VOICE TOKEN: السيرفر يقبل القناة ✅" || echo "::warning::السيرفر لم يعطِ إذن صوت للقناة $CH"

      - name: لقطات شاشة حقيقية من اللعبة (للمراجعة قبل الإرسال)
        continue-on-error: true
        run: |
          (command -v xvfb-run >/dev/null) || (apt-get update -qq && apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglu1-mesa >/dev/null)
          mkdir -p /tmp/shots
          KHAZNA_SHOT=1 KHAZNA_SHOT_DIR=/tmp/shots timeout 200 xvfb-run -a -s "-screen 0 1776x800x24" godot --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1776x800 --path . > shot.log 2>&1 || true
          grep -E "SHOT|SMOKE|ERROR" shot.log | head -60
          ls -la /tmp/shots

      - name: نشر اللقطات للمراجعة (مجلّد review_shots في نفس الفرع)
        continue-on-error: true
        working-directory: .
        run: |
          ls /tmp/shots/*.jpg >/dev/null 2>&1 || exit 0
          git config --global --add safe.directory "$PWD"
          git config user.name "khazna-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch -q origin jeu-khazna
          git checkout -q -B shots-tmp origin/jeu-khazna
          rm -rf jeu-khazna/review_shots && mkdir -p jeu-khazna/review_shots
          cp /tmp/shots/*.jpg jeu-khazna/review_shots/
          git add -A jeu-khazna/review_shots
          git commit -qm "لقطات المراجعة — بناء ${{ github.run_number }} [skip ci]" && git push -q origin HEAD:jeu-khazna
          git checkout -q ${{ github.sha }}

      - name: بناء أندرويد
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          # Gradle يحمّل مكتبات من Maven؛ عند الضغط (429) نعيد المحاولة بدل نسخة ناقصة
          for try in 1 2 3; do
            godot --headless --path . --export-debug "Android" build/khazna3d.apk 2>&1 | tail -40
            [ -f build/khazna3d.apk ] && break
            echo "::warning::محاولة البناء $try فشلت — إعادة بعد 60 ثانية"
            sleep 60
          done
          ls -la build
          test -f build/khazna3d.apk
          echo "--- فحص التوقيع وصلاحية الـ APK ---"
          SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          if ! $BT/apksigner verify build/khazna3d.apk >/dev/null 2>&1; then
            echo "::warning::الـ APK غير موقَّع — توقيعه الآن"
            $BT/zipalign -f -p 4 build/khazna3d.apk build/aligned.apk
            $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/khazna3d.apk build/aligned.apk
            rm -f build/aligned.apk build/khazna3d.apk.idsig
          fi
          $BT/apksigner verify --verbose build/khazna3d.apk | head -5 || { echo "التوقيع غير صالح"; exit 1; }
          $BT/aapt dump badging build/khazna3d.apk | grep -E "^package|sdkVersion|RECORD_AUDIO" || { echo "أندرويد لا يستطيع قراءة الـ APK"; exit 1; }
          if $BT/aapt dump xmltree build/khazna3d.apk AndroidManifest.xml | grep -q 'khazna3d'; then echo "DEEPLINK: khazna3d:// مسجّل ✅"; else echo "::warning::رابط khazna3d:// غير مسجّل"; fi
          echo "--- حجم الـ APK وأكبر محتوياته ---"
          ls -la build/khazna3d.apk | awk '{printf "APK SIZE: %.1f MB\n", $5/1048576}'
          unzip -lv build/khazna3d.apk | sort -k3 -n -r | head -12 | awk '{printf "  %8.1f MB  %s\n", $3/1048576, $8}'
          echo "--- فحص الصوت داخل الـ APK ---"
          if unzip -l build/khazna3d.apk | grep -qi "libagora"; then echo "VOICE: Agora مضمّن ✅"; else echo "VOICE: غير مضمّن ⚠"; fi
          unzip -l build/khazna3d.apk | grep -iE "agora" | head -5 || true

      - name: بناء ويندوز
        continue-on-error: true
        run: |
          python3 windows_plugin/ci/deps.py addons/godot_agora_win
          mkdir -p build/win
          godot --headless --path . --export-release "Windows Desktop" build/win/khazna3d.exe 2>&1 | tail -20
          ls -la build/win
          if ls build/win | grep -qi agora_rtc_sdk; then echo "WINVOICE: الصوت مضمّن في نسخة ويندوز ✅"; else echo "::warning::نسخة ويندوز بلا صوت"; fi
          (cd build/win && zip -q -r ../khazna3d-windows.zip .)
          ls -la build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: khazna3d-build-${{ github.run_number }}
          name: الخزنة (من الأعلى) — نموذج ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "الخزنة برؤية من الأعلى (Godot). khazna3d.apk للهاتف، khazna3d-windows.zip للحاسوب (فكّه وشغّل khazna3d.exe)."
          files: |
            jeu-khazna/godot_3d/build/khazna3d.apk
            jeu-khazna/godot_3d/build/khazna3d-windows.zip

      - name: آخر نسخة (رابط ثابت لزرّ التحميل في تطبيق الخزنة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: khazna3d-latest
          name: الخزنة 3D — آخر نسخة
          prerelease: true
          make_latest: false
          body: "رابط ثابت لآخر نسخة من الخزنة 3D (يُحدَّث مع كل بناء)."
          files: |
            jeu-khazna/godot_3d/build/khazna3d.apk
            jeu-khazna/godot_3d/build/khazna3d-windows.zip
