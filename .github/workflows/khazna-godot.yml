# نموذج «الخزنة 3D» (Godot 4): يُبنى عند تحديث مجلّد godot_3d في فرع jeu-khazna.
name: Khazna 3D (Godot)

on:
  push:
    branches: [jeu-khazna]
    paths:
      - 'jeu-khazna/godot_3d/**'
      - '.github/workflows/khazna-godot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agora:
    # مكتبة صوت Agora لـ Godot (AAR) — تُبنى بـ Gradle ثم تُعطى لخطوة بناء اللعبة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: بناء مكتبة الصوت
        run: |
          cd jeu-khazna/godot_3d/android_plugin
          gradle :agora:assembleRelease --no-daemon
          ls -la agora/build/outputs/aar/
      - uses: actions/upload-artifact@v4
        with:
          name: godot-agora
          path: jeu-khazna/godot_3d/android_plugin/agora/build/outputs/aar/*.aar

  build:
    needs: agora
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    defaults:
      run:
        working-directory: jeu-khazna/godot_3d
    steps:
      - uses: actions/checkout@v4

      - name: الإعداد (قوالب التصدير ومفتاح التوقيع)
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          [ -d ~/.config/godot ] || cp -r /root/.config/godot ~/.config/godot || true
          [ -d ~/.local/share/godot/export_templates/4.3.stable ] || cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          ls ~/.local/share/godot/export_templates/
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - uses: actions/download-artifact@v4
        with:
          name: godot-agora
          path: jeu-khazna/godot_3d/addons/godot_agora/bin

      - name: قالب بناء أندرويد (لإضافة الصوت)
        run: |
          mv addons/godot_agora/bin/*.aar addons/godot_agora/bin/GodotAgora.aar
          ls -la addons/godot_agora/bin
          command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip >/dev/null)
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          echo -n "4.3.stable" > android/.build_version
          touch android/build/.gdignore
          SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          echo "SDK=$SDK"; ls $SDK || true
          (yes | $SDK/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1) || (yes | sdkmanager --licenses >/dev/null 2>&1) || true

      - name: الأصول (خطّ عربي ونموذج الحارس)
        run: |
          (command -v curl >/dev/null && command -v python3 >/dev/null) || (apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null)
          mkdir -p fonts models
          curl -fsSL -o fonts/Tajawal-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf
          curl -fsSL -o models/CesiumMan.glb https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb
          python3 tools/fetch_assets.py
          ls -la fonts models sounds ph/tex | head -60
          ls ph/models

      - name: استيراد الملفّات
        run: |
          godot --headless --path . --import 2>&1 | tail -20 || true
          [ -d .godot/imported ] || godot --headless --path . --editor --quit 2>&1 | tail -20 || true
          ls .godot/imported | head

      - name: اختبار تشغيل (أخطاء السكربت توقف البناء)
        run: |
          KHAZNA_SMOKE=1 timeout 120 godot --headless --path . > run.log 2>&1 || true
          grep -v "Parameter \"m\" is null\|mesh_storage.h" run.log | tail -60
          grep -q "SMOKE vault solid ok" run.log || { echo "يمكن الدخول في الخزنة"; exit 1; }
          grep -q "SMOKE guard animated ok" run.log || { echo "الحارس لا يتحرّك"; exit 1; }
          grep -q "SMOKE caught ok" run.log || { echo "بعد الإمساك لا يمكن الإكمال"; exit 1; }
          grep -q "SMOKE wrong stays ok" run.log || { echo "الخطأ في القرص يُخرج اللاعب"; exit 1; }
          grep -q "SMOKE sync ok" run.log || { echo "مزامنة الحرّاس لا تعمل"; exit 1; }
          grep -q "SMOKE tools ok" run.log || { echo "أدوات المحلّل لا تعمل"; exit 1; }
          grep -q "SMOKE reach ok" run.log || { echo "العميل لا يستطيع الوصول إلى كل الأهداف"; exit 1; }
          grep -q "SMOKE final stage: 3" run.log || { echo "اختبار الألغاز لم يصل إلى الهروب"; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid (call|get|set)" run.log; then exit 1; fi

      - name: بناء أندرويد
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/khazna3d.apk 2>&1 | tail -60
          if [ ! -f build/khazna3d.apk ]; then
            echo "::warning::فشل البناء مع الصوت — بناء بديل بلا صوت داخل اللعبة"
            sed -i 's/gradle_build\/use_gradle_build=true/gradle_build\/use_gradle_build=false/' export_presets.cfg
            godot --headless --path . --export-debug "Android" build/khazna3d.apk 2>&1 | tail -20
            echo "novoice" > build/NOVOICE
          fi
          ls -la build
          test -f build/khazna3d.apk
          echo "--- فحص الصوت داخل الـ APK ---"
          if unzip -l build/khazna3d.apk | grep -qi "libagora"; then echo "VOICE: Agora مضمّن ✅"; else echo "VOICE: غير مضمّن ⚠"; fi
          unzip -l build/khazna3d.apk | grep -iE "agora" | head -5 || true

      - name: بناء ويندوز
        continue-on-error: true
        run: |
          godot --headless --path . --export-release "Windows Desktop" build/khazna3d.exe 2>&1 | tail -20
          ls -la build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: khazna3d-build-${{ github.run_number }}
          name: الخزنة 3D — نموذج ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "نموذج تجريبي ثلاثي الأبعاد (Godot). khazna3d.apk للهاتف، khazna3d.exe للحاسوب."
          files: |
            jeu-khazna/godot_3d/build/khazna3d.apk
            jeu-khazna/godot_3d/build/khazna3d.exe
