name: Atelier Broderie — compilation

on:
  push:
    branches: [broderie-flutter]
    paths:
      - 'broderie_app/**'
      - 'vitrine/**'
      - '.github/workflows/broderie-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: broderie_app

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: site-vitrine
          path: vitrine/

  android:
    needs: analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --org dz.atelier --project-name atelier_broderie .
      - name: Permission Internet + nom de l'application
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          grep -q 'android.permission.CAMERA' $M || sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="Atelier Broderie"|' $M
      - name: Désactiver lintVital (plante sur les plugins tiers, ex. url_launcher)
        run: |
          F=android/build.gradle.kts; [ -f $F ] || F=android/build.gradle
          printf '\nsubprojects {\n    tasks.matching { it.name.contains("lintVital") }.configureEach { enabled = false }\n}\n' >> $F
          tail -4 $F
      - name: Clé de signature fixe (les mises à jour s'installent par-dessus l'ancienne version)
        run: |
          mkdir -p ~/.android
          cp android-signing/atelier-debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-broderie-android
          path: broderie_app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: analyse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Windows
        run: flutter create --platforms=windows --org dz.atelier --project-name atelier_broderie .
      - name: Titre de la fenêtre
        shell: pwsh
        run: |
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"atelier_broderie"', 'L"Atelier Broderie"' | Set-Content $f
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-broderie-windows
          path: broderie_app/build/windows/x64/runner/Release/
      - name: Installateur Windows (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" installer\atelier.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-broderie-windows-installateur
          path: broderie_app/build/installer/*.exe
