# My DTF Admin — application Windows (Electron). Produit l'installateur .exe en Release GitHub.
name: My DTF — Admin Windows

on:
  workflow_dispatch:
  push:
    branches: [dtf-atelier]
    paths: ['my_dtf_admin_desktop/**', '.github/workflows/my_dtf_admin_desktop.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: my_dtf_admin_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: my-dtf-admin-windows-v1.0.${{ github.run_number }}
          name: My DTF Admin Windows v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Installateur Windows de l'application administrateur My DTF.
          files: my_dtf_admin_desktop/dist/My-DTF-Admin-Setup.exe
