# My DTF — programme Windows (Electron) pour toute l'équipe. Produit l'installateur .exe :
#  - une Release versionnée « my-dtf-desktop-v1.1.N » (lien à partager) ;
#  - la Release fixe « my-dtf-desktop-latest » lue par la mise à jour automatique (latest.yml + .exe).
name: My DTF — Programme Windows

on:
  workflow_dispatch:
  push:
    branches: [dtf-atelier]
    paths: ['my_dtf_admin_desktop/**', '.github/workflows/my_dtf_admin_desktop.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: my_dtf_admin_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Numéro de version
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Release versionnée
        uses: softprops/action-gh-release@v2
        with:
          tag_name: my-dtf-desktop-v1.1.${{ github.run_number }}
          name: My DTF — Windows v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Programme Windows My DTF pour toute l'équipe (المدير، المسيّر، المصمّم، الطابع).
            Télécharger « My-DTF-Setup.exe » puis l'installer. Les versions suivantes s'installent automatiquement.
          files: |
            my_dtf_admin_desktop/dist/My-DTF-Setup.exe
      - name: Release fixe pour la mise à jour automatique
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view my-dtf-desktop-latest >/dev/null 2>&1 || \
            gh release create my-dtf-desktop-latest --target "${{ github.sha }}" --title "My DTF — Windows (dernière version)" \
              --latest=false --notes "Fichiers lus par la mise à jour automatique du programme Windows. Ne pas supprimer."
          gh release upload my-dtf-desktop-latest dist/My-DTF-Setup.exe dist/My-DTF-Setup.exe.blockmap dist/latest.yml --clobber
