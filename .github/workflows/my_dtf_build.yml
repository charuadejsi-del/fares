# À placer à la racine du dépôt : .github/workflows/my_dtf_build.yml
# Construit l'APK client et le site web de My DTF, puis publie une release GitHub.
name: My DTF — build client

on:
  workflow_dispatch:
  push:
    branches: [dtf-atelier]
    paths: ['my_dtf/**', '.github/workflows/my_dtf_build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_dtf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les dossiers Android / Web
        run: |
          flutter create --org com.mydtf --project-name my_dtf --platforms android,web .
          rm -f test/widget_test.dart   # test d'exemple généré, inutile ici
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $MANIFEST
          sed -i 's#android:label="my_dtf"#android:label="My DTF"#' $MANIFEST

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk My-DTF.apk

      - name: Site web
        run: |
          flutter build web --release
          cd build/web && zip -qr ../../my_dtf_web.zip .

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: my-dtf-v0.3.${{ github.run_number }}
          name: My DTF client v0.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            - APK Android : My-DTF.apk
            - Site web : my_dtf_web.zip (à déposer sur Netlify)
          files: |
            my_dtf/My-DTF.apk
            my_dtf/my_dtf_web.zip
