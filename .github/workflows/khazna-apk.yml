# يبني تطبيق «الخزنة» لأندرويد (APK) عند كل تحديث لمجلّد التطبيق في فرع jeu-khazna.
# الملف الناتج يظهر في صفحة التشغيل (Actions) تحت «Artifacts» باسم khazna-apk.
name: Khazna APK

on:
  push:
    branches: [jeu-khazna]
    paths:
      - 'jeu-khazna/app_flutter/**'
      - '.github/workflows/khazna-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeu-khazna/app_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد ملفات أندرويد
        run: |
          flutter create --platforms=android --org com.khazna --project-name khazna .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          sed -i 's#android:label="khazna"#android:label="الخزنة"#' "$MANIFEST"

      - run: flutter pub get

      - name: التحليل
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      - name: بناء APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: khazna-apk
          path: jeu-khazna/app_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # نسخة من الـ APK في فرع مستقل (khazna-apk) ليسهل تحميلها بدون فتح صفحة Actions
      - name: نشر الـ APK في فرع khazna-apk
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/apkrepo && cd /tmp/apkrepo
          git init -q -b khazna-apk
          cp "$GITHUB_WORKSPACE/jeu-khazna/app_flutter/build/app/outputs/flutter-apk/app-release.apk" khazna.apk
          git add khazna.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" khazna-apk
