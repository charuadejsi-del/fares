# يبني تطبيق «الخزنة» لأندرويد (APK) عند كل تحديث لمجلّد التطبيق في فرع jeu-khazna.
# الملف الناتج يظهر في صفحة التشغيل (Actions) تحت «Artifacts» باسم khazna-apk.
name: Khazna APK + Windows

on:
  push:
    branches: [jeu-khazna]
    paths:
      - 'jeu-khazna/app_flutter/**'
      - 'jeu-khazna/tools/assets.json'
      - '.github/workflows/khazna-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeu-khazna/app_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تحميل الأصول (صور، موسيقى، خطوط)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          assets = json.load(open('../tools/assets.json', encoding='utf-8'))
          for rel, url in assets.items():
              if rel.startswith('_'):
                  continue
              dest = os.path.join('assets', rel)
              if os.path.exists(dest):
                  print('موجود:', rel); continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              urllib.request.urlretrieve(url, dest)
              print('حُمّل:', rel, os.path.getsize(dest))
          PY

      - name: توليد ملفات أندرويد
        run: |
          flutter create --platforms=android --org com.khazna --project-name khazna .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          sed -i 's#android:label="khazna"#android:label="الخزنة"#' "$MANIFEST"

      - run: flutter pub get

      - name: الأيقونة
        run: dart run flutter_launcher_icons

      - name: التحليل
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      - name: اختبار الاتصال أونلاين (Supabase Realtime بين عميلين)
        working-directory: jeu-khazna
        run: |
          mkdir -p /tmp/rt && cd /tmp/rt && npm init -y >/dev/null && npm i @supabase/supabase-js@2 >/dev/null
          cp "$GITHUB_WORKSPACE/jeu-khazna/tools/realtime-check.mjs" . && node realtime-check.mjs

      - name: بناء APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: khazna-apk
          path: jeu-khazna/app_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: نسخ الـ APK باسم واضح
        run: cp build/app/outputs/flutter-apk/app-release.apk build/khazna.apk

      # إصدار (Release) فيه ملف الـ APK مباشرة، بلا ضغط: يُحمَّل ويُثبَّت من الهاتف مباشرة
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: khazna-build-${{ github.run_number }}
          name: الخزنة — نسخة ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "ملف APK للتثبيت المباشر على أندرويد (نسخة تجريبية)."
          files: jeu-khazna/app_flutter/build/khazna.apk

  # نسخة الحاسوب (Windows): نفس اللعبة، تلعب أونلاين مع الهاتف
  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: jeu-khazna/app_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تحميل الأصول
        run: |
          python - <<'PY'
          import json, os, urllib.request
          assets = json.load(open('../tools/assets.json', encoding='utf-8'))
          for rel, url in assets.items():
              if rel.startswith('_'):
                  continue
              dest = os.path.join('assets', rel)
              if os.path.exists(dest):
                  continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              urllib.request.urlretrieve(url, dest)
          PY

      - name: توليد ملفات Windows
        run: |
          flutter create --platforms=windows --org com.khazna --project-name khazna .
          sed -i 's/Win32Window::Size size(1280, 720);/Win32Window::Size size(560, 980);/' windows/runner/main.cpp
          sed -i 's/window.Create(L"khazna"/window.Create(L"Al Khazna"/' windows/runner/main.cpp

      - run: flutter pub get

      - name: بناء نسخة Windows
        run: flutter build windows --release

      - name: ضغط النسخة
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/khazna-windows.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: khazna-build-${{ github.run_number }}
          name: الخزنة — نسخة ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: jeu-khazna/app_flutter/build/khazna-windows.zip

